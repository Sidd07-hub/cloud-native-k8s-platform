name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: |
        docker build -t siddhesh013/backend-app:v1 ./backend

    - name: Push Backend Image
      run: |
        docker push siddhesh013/backend-app:v1

    - name: Build Frontend Image
      run: |
        docker build -t siddhesh013/frontend-app:v1 ./frontend

    - name: Push Frontend Image
      run: |
        docker push siddhesh013/frontend-app:v1